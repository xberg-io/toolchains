# Org toolchain baseline. A repository's mise.toml must use these exact versions for every tool it declares,
# unless its toolchains.toml records an override with a reason. Keys are the names consumers write in mise.toml.
#
# rust is compared against the channel in rust-toolchain.toml, which stays authoritative for components and
# targets; repositories do not declare rust in mise.toml.
#
# Tools that must match a repository's own lockfile (wasm-bindgen-cli against Cargo.lock) are repo-owned and
# deliberately absent.
#
# ai-rulez is never pinned: every invocation runs the newest release with `npx -y ai-rulez@latest`, on the
# baseline's node.

[tools]
# Runtimes
node = "26.12.1"
pnpm = "12.15.0"
python = "3.13.18"
uv = "0.13.6"
go = "1.27.3"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"
gradle = "9.8.2"
ruby = "3.4.12"
dotnet = "10.0.403"
zig = "0.17.0"
rust = "1.99.1"

# Org CLIs
"github:Goldziher/poly" = "0.31.2"
"github:Goldziher/adrlint" = "0.4.1"
"github:xberg-io/alef" = "0.115.9"

# Rust tooling
sccache = "0.19.0"
cargo-deny = "0.20.2"
"github:nextest-rs/nextest" = { version = "0.9.150", version_prefix = "cargo-nextest-" }
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:DevinR528/cargo-sort" = "2.1.4"
"github:rust-cross/cargo-zigbuild" = "0.24.0"
"github:rustwasm/wasm-pack" = "0.15.0"

# CI and infrastructure CLIs
gh = "2.103.3"
yq = "4.54.1"
jq = "1.8.2"
actionlint = "1.7.12"
bats = "1.14.0"
lychee = "0.24.2"
helm = "4.3.1"
# kubectl supports one minor of skew from the server, and the staging GKE control plane is on 1.35: stay on 1.36
# until it moves (renovate.json holds the line).
kubectl = "1.36.5"
opentofu = "1.13.2"
k6 = "2.3.0"
aws-cli = "2.38.6"
